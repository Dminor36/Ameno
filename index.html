<!DOCTYPE html>
<html lang="zh-Hant" class=""><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 叫瀏覽器不要把這個檔案存起來重複使用，改版後才不會拿到舊的 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>沒有網際網路連線</title>
<script>
  /* 在腳本把設定套用上去之前先藏起來，避免閃過 HTML 裡的預設文字。
     2 秒保險：就算初始化出錯也一定會顯示出來，不會變成空白頁。 */
  document.documentElement.className += " js-loading";
  setTimeout(function(){ document.documentElement.classList.remove("js-loading"); }, 2000);
</script>
<style>
  /* Chrome 離線恐龍遊戲的配色：白底、單一深灰、無圓角、無陰影 */
  :root{--ink:#535353;--ink-soft:#a3a3a3;--line:#d8d8d8;--paper:#ffffff;--red:#8f3d2b;--green:#4a7a4a}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Courier New",
      "Noto Sans Mono CJK TC","PingFang TC","Microsoft JhengHei",monospace;
    color:var(--ink);background:var(--paper);
    padding:18px;-webkit-font-smoothing:antialiased;
  }
  html.js-loading #wrap{visibility:hidden}
  #wrap{display:flex;gap:20px;align-items:flex-start;margin:0 auto}
  #panel{width:330px;flex:0 0 330px;position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto;padding-right:4px}
  #stage{flex:1;min-width:0}
  body.baked #panel{display:none}
  /* 遊戲畫面滿版：拿掉外框與內距，畫布自己撐到最大 */
  /* 遊戲畫面：寬度滿版、上下置中（跟 Chrome 離線頁一樣是一條置中的橫帶） */
  #scr-game .sheet{border:none;padding:0;background:none;margin:0;
    min-height:calc(100vh - 36px);display:flex;flex-direction:column;justify-content:center}
  body.baked #scr-game .sheet{min-height:100vh}
  body.baked{padding:0}
  body.baked #wrap{gap:0;max-width:none}
  /* 編輯器裡也讓遊戲區延伸到視窗右緣，抵銷 body 的內距 */
  #scr-game .sheet{margin-right:-18px}
  body.baked #scr-game .sheet{margin-right:0}
  /* 標題／問答／結果維持好讀的欄寬 */
  #scr-title .sheet,#scr-quiz .sheet,#scr-result .sheet{max-width:780px;margin-left:auto;margin-right:auto}
  body.baked #scr-title,body.baked #scr-quiz,body.baked #scr-result{padding:18px}
  /* 畫布佔滿整個視窗，HUD 與按鈕改成浮在上面，才不會把畫布擠出畫面 */
  #scr-game{position:relative}
  #hud{position:absolute;left:0;right:0;top:0;padding:10px 16px;pointer-events:none;z-index:2}
  #death-row{position:absolute;left:0;right:0;bottom:7%;margin:0;justify-content:center;z-index:2}
  h1{font-size:22px;margin:0 0 2px;letter-spacing:.18em}
  h1 small{display:block;font-size:10px;letter-spacing:.4em;color:var(--ink-soft);margin-top:6px}
  .sheet{background:var(--paper);border:2px solid var(--ink);padding:18px 20px;margin-top:14px}
  .card{border:2px solid var(--line);padding:12px 14px;margin-bottom:12px}
  .card h3{margin:0 0 10px;font-size:12px;letter-spacing:.24em;color:var(--ink);
    border-bottom:2px solid var(--line);padding-bottom:7px}
  label{display:block;font-size:12.5px;margin:12px 0 5px;letter-spacing:.06em}
  label:first-child{margin-top:0}
  .hint{color:var(--ink-soft);font-size:11px}
  textarea,input[type=text]{width:100%;font-family:inherit;font-size:14px;color:var(--ink);background:var(--paper);
    border:2px solid var(--line);padding:7px 8px;outline:none;resize:vertical;line-height:1.6;border-radius:0}
  textarea:focus,input[type=text]:focus{border-color:var(--ink)}
  .ctrl{margin:10px 0 3px}
  .ctrl .top{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;letter-spacing:.04em}
  .ctrl .val{font-size:12px;color:var(--ink);font-weight:700}
  .ctrl .note{font-size:11px;color:var(--ink-soft);line-height:1.55;margin-top:2px}
  input[type=range]{width:100%;margin:4px 0 0;accent-color:#535353;height:18px}
  .chk{display:flex;align-items:center;gap:8px;font-size:12.5px;margin:10px 0}
  .chk input{width:15px;height:15px;accent-color:#535353}
  button{font-family:inherit;font-size:13px;color:var(--ink);cursor:pointer;background:var(--paper);
    border:2px solid var(--ink);border-radius:0;padding:8px 18px;letter-spacing:.14em;
    transition:background .1s,color .1s}
  button:hover{background:var(--ink);color:var(--paper)}
  button:active{transform:translateY(1px)}
  button.ghost{border-color:var(--line);font-size:12px;padding:7px 14px;color:var(--ink-soft)}
  button.ghost:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  button.primary{background:var(--ink);color:var(--paper)}
  button.primary:hover{background:var(--paper);color:var(--ink)}
  button.wide{display:block;width:100%;margin-top:8px}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .chip{font-size:11px;padding:5px 9px;cursor:pointer;color:var(--ink-soft);border:2px solid var(--line);
    border-radius:0;background:transparent;letter-spacing:.04em}
  .chip:hover{border-color:var(--ink);background:var(--ink);color:var(--paper)}
  #readout{font-size:11.5px;line-height:1.95;color:var(--ink-soft)}
  #readout b{color:var(--ink)}
  #warn{font-size:12px;color:var(--red);line-height:1.6;margin-top:8px;display:none;
    border-left:3px solid var(--red);padding-left:8px}
  #warn.on{display:block}
  #hud{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;margin-bottom:8px;flex-wrap:wrap}
  #collected{font-size:20px;letter-spacing:.25em;min-height:30px;line-height:1.4;flex:1;padding-bottom:4px;word-break:break-all}
  #collected .blank{color:var(--line)}
  #meta{font-size:12px;color:var(--ink-soft);white-space:nowrap;letter-spacing:.08em}
  canvas{display:block;margin:0 auto;background:var(--paper);
    border-bottom:2px solid var(--line);touch-action:manipulation}
  .tip{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;line-height:1.7}
  section{display:none}
  section.on{display:block}
  .question-box{font-size:clamp(18px,3vw,26px);line-height:1.9;letter-spacing:.14em;margin:8px 0 4px}
  .answer-big{font-size:clamp(24px,4.5vw,38px);letter-spacing:.14em;color:var(--ink);margin:10px 0;
    line-height:1.5;word-break:break-all;font-weight:700}
  .verdict{font-size:12.5px;margin-top:12px;min-height:22px;letter-spacing:.06em}
  .verdict.bad{color:var(--red)}
  .verdict.good{color:var(--green)}
  .stamp{display:inline-block;border:2px solid var(--ink);color:var(--ink);padding:5px 14px;font-size:11px;
    letter-spacing:.34em;border-radius:0;margin-bottom:10px}
  .divider{border:none;border-top:2px solid var(--line);margin:16px 0}
  #res-note{display:none;white-space:pre-wrap;word-break:break-word;font-size:clamp(15px,2.4vw,19px);
    line-height:2;letter-spacing:.1em;margin:16px 0 4px;padding:14px 16px;
    background:var(--paper);border:2px dashed var(--line);border-radius:0}
  /* 標題頁：仿瀏覽器離線頁 —— 小圖示 + 左對齊的文字 */
  #scr-title .sheet.offline{border:none;background:none;padding:0;margin:0;
    min-height:calc(100vh - 36px);display:flex;align-items:center;justify-content:center}
  body.baked #scr-title .sheet.offline{min-height:100vh}
  .offline-inner{max-width:520px;width:100%;padding:0 20px;text-align:left}
  #title-dino{display:block;image-rendering:pixelated;margin:0 0 26px -4px}
  #title-img{display:none;margin:0 0 26px;image-rendering:pixelated;object-fit:contain}
  #title-big{font-size:clamp(20px,3.4vw,27px);letter-spacing:.1em;margin:0 0 14px;color:var(--ink)}
  #title-sub{font-size:14px;line-height:1.9;color:var(--ink-soft);margin-bottom:22px;letter-spacing:.04em}
  #title-start{font-size:14.5px;color:var(--ink);letter-spacing:.06em;
    display:inline-block;padding:3px 7px;background:#cfd8e3;border-radius:2px;cursor:pointer}
  .center{text-align:center;padding:26px 10px}
  @media(max-width:900px){#wrap{flex-direction:column}#panel{position:static;width:100%;flex:none;max-height:none}}
</style>
</head>
<body class="baked">
<div id="wrap">

  <!-- ================= 調參面板（匯出時會整塊移除） ================= -->
  

  <!-- ================= 遊戲舞台（匯出時原樣保留） ================= -->
  <main id="stage">

    <section id="scr-title" class="on">
      <div class="sheet offline">
        <div class="offline-inner">
          <canvas id="title-dino" width="88" height="110"></canvas>
          <img id="title-img" alt="">
          <div id="title-big">文字闖關</div>
          <div id="title-sub">閃過所有文字，看看它們拼成什麼</div>
          <div id="title-start">按下空格鍵即可開始遊戲</div>
        </div>
      </div>
    </section>

    <section id="scr-game">
      <div class="sheet">
        <div id="hud">
          <div id="collected"></div>
          <div id="meta"></div>
        </div>
        <canvas id="cv"></canvas>
        <!-- 平常什麼都不放，撞到之後才冒出「直接作答」 -->
        <div class="row" id="death-row" style="margin-top:12px;justify-content:center;display:none">
          <button class="primary" id="btn-answer">直接作答</button>
        </div>
      </div>
    </section>

    <section id="scr-quiz">
      <div class="sheet">
        <div class="stamp">S T A G E   C L E A R</div>
        <div class="tip" id="quiz-lead">你一路閃過的文字，組合起來是：</div>
        <div class="question-box" id="quiz-question"></div>
        <hr class="divider">
        <label>你的答案</label>
        <input id="in-guess" type="text" placeholder="在這裡作答……" autocomplete="off">
        <div class="verdict" id="verdict"></div>
        <div class="row">
          <button class="primary" id="btn-submit">送出答案</button>
          <button class="ghost" id="btn-replay">再跑一次關卡</button>
        </div>
      </div>
    </section>

    <section id="scr-result">
      <div class="sheet">
        <div class="stamp">C L E A R</div>
        <div class="tip">問題</div>
        <div class="question-box" id="res-question"></div>
        <div class="tip">你獲得的答案</div>
        <div class="answer-big" id="res-answer"></div>
        <div id="res-note"></div>
        <div id="res-stats" class="tip"></div>
        <hr class="divider">
        <div class="row">
          <button class="primary" id="btn-again">再玩一次</button>
        </div>
      </div>
    </section>

  </main>
</div>

/* 把設定洗乾淨：舊版存下來的設定、被改壞的數值、或缺少的欄位，
   一律用預設值補回去。少了這一步，任何一個壞掉的值都會讓整個面板的數字消失。 */
function sanitize(c){
  SPEC.forEach(s=>{
    if(s.type === "check"){
      c[s.k] = (c[s.k] === undefined || c[s.k] === null) ? !!DEFAULTS[s.k] : !!c[s.k];
    }else{
      const v = parseFloat(c[s.k]);
      c[s.k] = isFinite(v) ? Math.min(s.max, Math.max(s.min, v)) : DEFAULTS[s.k];
    }
  });
  if(!Array.isArray(c.runnerImgs)) c.runnerImgs = [];
  if(typeof c.runnerImg === "string" && c.runnerImg && !c.runnerImgs.length) c.runnerImgs = [c.runnerImg];
  c.runnerImgs = c.runnerImgs.filter(x=>typeof x === "string" && x).slice(0,4);
  delete c.runnerImg;
  ["title","subtitle","question","answers","hint","quizLead","finalNote","titleImg"].forEach(k=>{
    if(typeof c[k] !== "string") c[k] = DEFAULTS[k] || "";
  });
  return c;
}

/* ================= 小工具 ================= */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function show(name){["title","game","quiz","result"].forEach(s=>$("scr-"+s).classList.toggle("on", s===name));}

/* ================= 音效（Web Audio 即時合成，不需外部檔案） ================= */
let AC = null, MASTER = null, muted = false;
function ac(){
  if(AC === false) return null;
  if(!AC){
    try{
      const C = window.AudioContext || window.webkitAudioContext;
      if(!C){ AC = false; return null; }
      AC = new C();
      MASTER = AC.createGain();
      MASTER.gain.value = 0.55;
      MASTER.connect(AC.destination);
    }catch(e){ AC = false; return null; }
  }
  if(AC.state === "suspended"){ try{ AC.resume(); }catch(e){} }
  return AC;
}
function sfxOn(){ return CFG.sfx && !muted && CFG.sfxVol > 0; }
function blip(f0, f1, dur, type, vol, delay){
  if(!sfxOn()) return;
  const c = ac(); if(!c) return;
  try{
    const t0 = c.currentTime + (delay||0);
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(f0, t0);
    if(f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20,f1), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.linearRampToValueAtTime((vol==null?0.2:vol) * CFG.sfxVol, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(MASTER);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }catch(e){}
}
function noiseBurst(dur, vol){
  if(!sfxOn()) return;
  const c = ac(); if(!c) return;
  try{
    const n = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, n, c.sampleRate);
    const dat = buf.getChannelData(0);
    for(let i=0;i<n;i++) dat[i] = (Math.random()*2-1) * Math.pow(1 - i/n, 2);
    const src = c.createBufferSource(); src.buffer = buf;
    const f = c.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 1400;
    const g = c.createGain(); g.gain.value = (vol==null?0.2:vol) * CFG.sfxVol;
    src.connect(f); f.connect(g); g.connect(MASTER);
    src.start();
  }catch(e){}
}

/* ================= 關卡 ================= */
const level = {text:"",answers:[],hint:"",chars:[],groups:[]};
/* 加權抽樣：權重 (1-bias)^i，bias 為 0 時等同等機率 */
function pickWeighted(rnd, n, bias){
  let total = 0; const w = [];
  for(let i=0;i<n;i++){ const v = Math.pow(1-bias, i); w.push(v); total += v; }
  let r = rnd()*total, k = 0;
  while(k < n-1 && r > w[k]){ r -= w[k]; k++; }
  return k;
}
function buildGroups(chars,seed,maxChars,sizeBias){
  const rnd = mulberry32(seed); const g=[]; let i=0;
  while(i<chars.length){
    let n = 1 + pickWeighted(rnd, maxChars, sizeBias);
    n = Math.min(n, chars.length - i);
    g.push(chars.slice(i,i+n)); i += n;
  }
  return g;
}
/* 這一輪實際使用的種子：開啟「每次重開換一種」時用當輪骰出來的 */
function curSeed(){ return CFG.randomSeed ? game.runSeed : Math.round(CFG.seed); }
function groupsFor(seed){
  const s = (level.text.length*2654435761 + level.chars.length*97 + seed*40503) >>> 0;
  const maxChars = Math.max(1, Math.round(CFG.maxChars));   // 欄高只限制往上疊幾層，不限制橫躺的長度
  return buildGroups(level.chars, s, maxChars, CFG.sizeBias);
}
function prepareLevel(){
  level.text = String(CFG.question||"").trim();
  level.answers = String(CFG.answers||"").split(/[、,，\/|]/).map(s=>s.trim()).filter(Boolean);
  level.hint = String(CFG.hint||"").trim();
  level.chars = Array.from(level.text).filter(c=>!/\s/.test(c));
  level.groups = groupsFor(curSeed());
}

/* 算出目前該用多大的畫面（不動 DOM，面板的警告也用同一份計算，不會抓到過期的值）。
   寬度固定＝賽道長度固定＝難度一致；高度由視窗決定，多出來的就是天空。 */
function computeView(){
  const w = Math.max(200, Math.round(CFG.viewW));
  const par = cv.parentElement;
  // 先把畫布縮成 0，父層才會回報「真正」的可用寬度。
  // 不然視窗縮小時，畫布自己的固定寬度會把父層撐住，量到的永遠是舊值。
  const prevW = cv.style.width;
  cv.style.width = "0px";
  let availW = par ? par.clientWidth : 0;
  if(availW > 0){
    try{
      const ps = getComputedStyle(par);
      availW -= (parseFloat(ps.paddingLeft)||0) + (parseFloat(ps.paddingRight)||0);
    }catch(e){}
  }
  cv.style.width = prevW;
  if(availW <= 0){
    // 遊戲畫面還沒顯示時量不到寬度，先用舞台或視窗估一個，面板的數字才不會亂跳
    const stage = document.getElementById("stage");
    availW = (stage && stage.clientWidth) || Math.max(320, (window.innerWidth||960) - (BAKED ? 0 : 386));
  }
  availW = Math.max(240, availW);
  const winH = window.innerHeight || 600;
  const availH = Math.max(160, BAKED ? winH : winH - 36);
  const groundOff = Math.max(10, Math.round(CFG.groundOff));
  const minH = Math.round(groundOff + jumpHeight() + player.h + 8);   // 要裝得下跳到最高的恐龍
  const h = Math.max(minH, Math.round(CFG.viewH));   // 橫帶的高度（設計單位）
  let scale = availW / w;                        // 寬度優先：一定撐滿
  let tight = false;
  if(h * scale > availH){                        // 除非視窗太矮，才縮到塞得下
    scale = availH / h; tight = true;
  }
  return {w:w, h:h, scale:scale, groundOff:groundOff, minH:minH, tight:tight};
}

let lastLayout = "";
function resize(force){
  const v = computeView();
  const cssW = Math.max(1, Math.round(v.w*v.scale)), cssH = Math.max(1, Math.round(v.h*v.scale));
  const key = cssW+"x"+cssH+"x"+v.w+"x"+v.h;
  if(force !== true && key === lastLayout) return;   // 尺寸沒變就別重設畫布（重設會清掉畫面）
  lastLayout = key;
  W = v.w; H = v.h; SCALE = v.scale;
  DPR = Math.min(window.devicePixelRatio||1, 2);
  cv.width = Math.round(cssW*DPR); cv.height = Math.round(cssH*DPR);
  cv.style.width = cssW + "px"; cv.style.height = cssH + "px";
  ctx.setTransform(DPR*SCALE, 0, 0, DPR*SCALE, 0, 0);   // 之後畫的東西全部自動放大
  groundY = H - v.groundOff;                     // 地面固定離底部這麼遠
}
window.addEventListener("resize", ()=>resize());
window.addEventListener("orientationchange", ()=>setTimeout(()=>resize(), 120));
/* 視窗大小沒變、但版面變了（面板展開、捲軸出現…）也要跟著調整 */
try{
  if(window.ResizeObserver && cv.parentElement){
    let pending = false;
    new ResizeObserver(()=>{
      if(pending) return;
      pending = true;
      requestAnimationFrame(()=>{ pending = false; resize(); });
    }).observe(cv.parentElement);
  }
}catch(e){}

/* 依目前參數排出整關的障礙物（遊戲與自動試跑共用同一份，確保一致） */
function buildObstacles(baseW, groups, seed){
  groups = groups || level.groups;
  seed = (seed==null) ? curSeed() : seed;
  const baseCell = Math.round(CFG.cell);
  const slots = Math.max(1, Math.round(CFG.maxStack));   // 固定欄高（格數）
  const out = [];
  let x = baseW + CFG.startSpeed*CFG.warmup + 60;
  let sp = CFG.startSpeed;
  groups.forEach((g,i)=>{
    const rnd = mulberry32((((seed*7919) ^ (i*104729)) >>> 0) || 1);
    // 每一個字各自抽大／中／小，像仙人掌叢一樣高低不齊
    const sizes = g.map(()=>{
      const roll = rnd()*100;
      const mul = roll < CFG.pctSmall ? CFG.sizeSmall
                : roll < CFG.pctSmall + CFG.pctLarge ? CFG.sizeLarge : 1;
      return Math.max(8, Math.round(baseCell * mul));
    });
    const wmax = Math.max.apply(null, sizes);
    // 每一組都佔固定的欄高（slots 格）。字數不足時，把文字隨機分配到其中幾格，
    // 沒被佔到的格子就成為離地的空間或中間的空隙。
    // 另一種型態：整組「橫躺」成一排貼在地上，只有一格高但很寬。
    const lie = g.length > 1 && (g.length > slots || rnd()*100 < CFG.lieChance);   // 疊不下就一定橫躺
    if(lie){
      // 橫躺：一個接一個貼地排開，每個字寬度不同，上緣自然高低不齊
      const cells = []; let dx = 0;
      for(let k=0;k<g.length;k++){
        cells.push({dx:dx, top:sizes[k], ch:g[k], size:sizes[k]});
        dx += sizes[k];
      }
      const o = {x:x, w:dx, cell:wmax, chars:g, cells:cells, float:0,
                 topOff:Math.max.apply(null,sizes),
                 duckable:false, lie:true, n:g.length, i:i, seed:(i*9301+49297)>>>0, passed:false};
      out.push(o);
      sp = Math.min(CFG.maxSpeed, sp + CFG.speedStep);
      const gapL = gapFor(sp, o.topOff, o.w) * (1 + rnd()*CFG.gapJitter);
      o.gapAfter = gapL; o.speedAfter = sp;
      x += o.w + gapL;
      return;
    }
    let idx;
    if(g.length >= slots || rnd()*100 >= CFG.riseChance){
      idx = g.map((_,k)=>k);                       // 貼地、緊密堆疊
    }else{
      // 加權抽格：權重 (1-lowBias)^格號，越高的格子越不容易被選中
      const lockBottom = !CFG.allowLift;
      const pool = [];
      for(let s=(lockBottom?1:0); s<slots; s++) pool.push(s);
      idx = lockBottom ? [0] : [];
      const need = g.length - (lockBottom?1:0);
      for(let t=0; t<need; t++){
        let total=0;
        const wts = pool.map(s=>{ const v = Math.pow(1-CFG.lowBias, s); total += v; return v; });
        let r = rnd()*total, k = 0;
        while(k < pool.length-1 && r > wts[k]){ r -= wts[k]; k++; }
        idx.push(pool[k]); pool.splice(k,1);
      }
      idx.sort((a,b)=>a-b);
    }
    // 直立：由下往上疊，每個字用自己的尺寸並水平置中；文字由上往下讀
    const cells = []; let acc = idx[0]*baseCell;   // 最底下那格離地多高
    for(let k=0;k<idx.length;k++){
      if(k>0) acc += (idx[k]-idx[k-1]-1)*baseCell; // 中間空掉的格子
      const sz = sizes[g.length-1-k];
      acc += sz;
      cells.push({dx:(wmax-sz)/2, top:acc, ch:g[g.length-1-k], size:sz});
    }
    const flt = cells[0].top - cells[0].size;      // 最底下那格的下緣離地多高
    // 這一組的高度＝最高那個方塊的上緣，跟它由幾個字組成無關
    const topOff = cells[cells.length-1].top;
    const duckable = flt >= DUCK_H;                // 底下鑽得過去（但間距仍以最高處計算）
    const o = {x:x, w:wmax, cell:wmax, chars:g, cells:cells, float:flt, topOff:topOff, duckable:duckable,
               lie:false, n:g.length, i:i, seed:(i*9301+49297)>>>0, passed:false};
    out.push(o);
    sp = Math.min(CFG.maxSpeed, sp + CFG.speedStep);
    const gap = gapFor(sp, topOff, o.w) * (1 + rnd()*CFG.gapJitter);   // 只會變寬，不會變窄
    o.gapAfter = gap; o.speedAfter = sp;
    x += o.w + gap;
  });
  return out;
}

/* 難度估計：每一組允許「按下跳躍」的時間窗口有多寬（玩家可以自由選擇跳多高，
   但跳太高會來不及落地）。取全關最窄的那一個，這才是人類真正的難度。 */
function timingStats(obs){
  let worst = Infinity, at = 0;
  for(let i=0;i<obs.length;i++){
    const o = obs[i];
    if(o.duckable) continue;
    const speed = o.speedAfter || CFG.startSpeed;
    const cross = (o.w + 34)/speed;
    const budget = (o.gapAfter==null) ? Infinity : (o.w + 34 + o.gapAfter)/speed;
    const maxA = jumpHeight();
    let best = -Infinity;
    const step = Math.max(2, (maxA - o.topOff)/24);
    for(let A = o.topOff + 6; A <= maxA; A += step){
      const p = jumpProfile(o.topOff + 2, A);
      if(!p.ok) continue;
      if(p.tLand > budget) break;                 // 跳這麼高會來不及落地
      const wnd = (p.tExit - cross) - p.tEnter;   // 可以按下跳躍的時間範圍
      if(wnd > best) best = wnd;
    }
    if(best < worst){ worst = best; at = i+1; }
  }
  return {ms: isFinite(worst) ? Math.round(worst*1000) : null, at:at};
}

/* 自動試跑：用一個「盡量早跳」的理想機器人跑一次關卡，確認參數是否可通關 */
function autoTest(seed){
  const cell = Math.round(CFG.cell), PW = player.w, PH = player.h, PX = player.x;
  const gy = 400 - Math.round(CFG.groundOff);   // 標稱值，位置都是相對地面算的
  const groups = (seed==null) ? level.groups : groupsFor(seed);
  const obs = buildObstacles(Math.round(CFG.viewW), groups, seed==null ? curSeed() : seed);
  if(!obs.length) return {ok:true};
  // 機器人會按照每一組實際的高度控制跳躍力道（該點放就點放），不是每次都跳滿
  const P={h:0,v:0,onGround:true};
  let passed=0, f=0, dt=1/60, lag=0, releaseH=0, released=true, minSlack=Infinity;
  while(passed < obs.length && f < 200000){
    f++;
    const speed = Math.min(CFG.maxSpeed, CFG.startSpeed + passed*CFG.speedStep), dx = speed*dt;
    let nxt=null;
    for(const o of obs){ if(o.x + o.w >= PX){ nxt = o; break; } }
    if(nxt && P.onGround && !nxt.duckable){          // 鑽得過去就不用跳
      const need = nxt.topOff + 2;
      const prof = jumpProfile(need, apexFor(need, speed, nxt.w));
      if(!prof.ok) return {ok:false, why:"跳躍高度不足，越不過第 "+(nxt.i+1)+" 組（需要 "+Math.round(need)+" px）"};
      const cross = (nxt.w + PW)/speed;
      if(prof.tExit - prof.tEnter < cross) return {ok:false, why:"滯空時間不足以橫越第 "+(nxt.i+1)+" 組"};
      const tt = (nxt.x - (PX + PW))/speed;
      const latest = prof.tExit - cross;             // 最晚可以起跳的時機
      if(lag <= 0){
        if(tt > 0 && tt <= latest){
          P.v = CFG.jumpV; P.onGround = false; releaseH = prof.hr; released = false;
          minSlack = Math.min(minSlack, latest - prof.tEnter);   // 這一跳的容錯窗口
        }
      }else if(tt > 0 && tt < prof.tEnter){
        return {ok:false, why:"落地後的起跳間隔太長，來不及跳過第 "+(nxt.i+1)+" 組"};
      }
    }
    const wasAir = !P.onGround;
    if(!P.onGround && !released && P.h >= releaseH){ if(P.v > CFG.cutV) P.v = CFG.cutV; released = true; }
    P.v -= CFG.gravity*dt; P.h += P.v*dt;
    if(P.h <= 0){ P.h = 0; P.v = 0; P.onGround = true; released = true; if(wasAir) lag = CFG.landLag; }
    else P.onGround = false;
    lag = Math.max(0, lag - dt);
    const py = gy - PH - P.h;
    for(const o of obs){
      o.x -= dx;
      if(PX + PW - CFG.forgive > o.x + 3 && PX + CFG.forgive < o.x + o.w - 3){
        for(const b of o.cells){
          const oc = b.size || o.cell || cell;
          const bl = o.x + b.dx, br = bl + oc;
          if(PX + PW - CFG.forgive <= bl + 3 || PX + CFG.forgive >= br - 3) continue;
          const bt = gy - b.top, bb = bt + oc;
          if(py + PH - 4 > bt + 3 && py + 4 < bb - 3)
            return {ok:false, why:"空間太窄：跳躍的落點會撞上第 "+(o.i+1)+" 組（把「間距係數」調高，或降低速度）"};
        }
      }
      if(!o.passed && o.x + o.w < PX){ o.passed = true; passed++; }
    }
  }
  return {ok: passed === obs.length, slack: minSlack};
}

function airTime(){ return 2*CFG.jumpV/CFG.gravity; }
function jumpHeight(){ return (CFG.jumpV*CFG.jumpV)/(2*CFG.gravity); }

/* 「剛好越過 need 這個高度」的最小跳躍長什麼樣子：
   起跳一律是滿速，玩家在高度 hr 放開按鍵（速度被截到 cutV），頂點剛好落在 need。
   回傳這一跳的滯空時間、以及在 need 高度以上的時間區間。 */
const PROFILES = new Map();
/* 要越過 need 這個高度、而且要在它上面待滿 cross（跨過整個寬度所需的時間），
   頂點至少得跳到多高。因為有短跳截斷，上升遠比下降快，不能用對稱拋物線估，
   直接拿真實軌跡二分搜尋。頂點量化到 2px，讓軌跡快取容易命中。 */
const APEX_CACHE = new Map();
function apexFor(need, speed, width){
  const cross = ((width || Math.round(CFG.cell)) + 34)/Math.max(1, speed);
  const key = need.toFixed(1)+"|"+cross.toFixed(3)+"|"+CFG.jumpV+"|"+CFG.gravity+"|"+CFG.cutV;
  const hit = APEX_CACHE.get(key);
  if(hit !== undefined) return hit;
  const maxA = jumpHeight();
  const okAt = A => { const p = jumpProfile(need, A); return p.ok && (p.tExit - p.tEnter) >= cross*1.06; };
  let lo = need + 6, hi = maxA, ans;
  if(lo >= hi || !okAt(maxA)){
    ans = Math.max(lo, maxA);                  // 再高也不夠，交給後面的判定回報失敗
  }else{
    for(let i=0;i<10;i++){
      const mid = Math.round((lo+hi)/4)*2;     // 量化到 2px
      if(mid <= lo || mid >= hi) break;
      if(okAt(mid)) hi = mid; else lo = mid;
    }
    ans = hi;
  }
  APEX_CACHE.set(key, ans);
  return ans;
}
function jumpProfile(need, apex){
  need = Math.max(0, need);
  apex = Math.max(apex, need + 6);
  const key = need.toFixed(1)+"|"+apex.toFixed(1)+"|"+CFG.jumpV+"|"+CFG.gravity+"|"+CFG.cutV;
  const cached = PROFILES.get(key);
  if(cached) return cached;
  const g = CFG.gravity, v0 = CFG.jumpV, cut = CFG.cutV;
  if(apex > jumpHeight()){                          // 跳不了那麼高
    const r = {ok:false, tLand:airTime(), tEnter:0, tExit:0, hr:0};
    PROFILES.set(key, r); return r;
  }
  const hr = Math.max(0, apex - cut*cut/(2*g));     // 該在多高放開按鍵
  let h = 0, v = v0, t = 0, released = false;
  const dt = 1/600;
  let tEnter = null, tExit = null;
  while(t < 4){
    if(!released && h >= hr){ if(v > cut) v = cut; released = true; }
    v -= g*dt; h += v*dt; t += dt;
    if(h >= need){ if(tEnter === null) tEnter = t; tExit = t; }
    if(h <= 0){ h = 0; break; }
  }
  if(need <= 0){ tEnter = 0; tExit = t; }
  const r = {tLand:t, tEnter:tEnter, tExit:tExit, hr:hr, ok: tEnter !== null};
  PROFILES.set(key, r);
  return r;
}

/* 這一組之後要留多少距離：need 是這一組實際要越過的高度（可鑽過的為 0）。
   heightLink 為 1 時完全依照「這一跳實際需要多久」來排，矮的障礙後面就會逼近。 */
function gapFor(speed, need, width){
  const full = airTime();
  const prof = jumpProfile(need, apexFor(need, speed, width));
  const tNeed = prof.ok ? Math.min(prof.tLand, full) : full;
  const ratio = tNeed/full;                       // 這一跳只需要滿跳的幾成時間
  const cell = Math.max(1, Math.round(CFG.cell));
  const base = speed*full*CFG.gapScale + CFG.gapBase + (need/cell)*CFG.gapStack;
  const g = base * (1 - CFG.heightLink*(1-ratio));  // 整段距離（含固定值）一起縮
  // 下限：這一跳的滯空 ＋ 落地後不能立刻再跳的那段時間，否則生成的關卡人跳不動
  return Math.max(g, CFG.minGap * speed * (tNeed + CFG.landLag));
}

function startLevel(){
  resize(true);          // 開場強制重算一次（剛切到遊戲畫面時尺寸才量得到）
  if(CFG.randomSeed){                    // 每次重開都骰一次新的排列
    game.runSeed = 1 + Math.floor(Math.random()*99999);
    prepareLevel();
    if(typeof onLevelRebuilt === "function") onLevelRebuilt();   // 讓面板的數據跟著更新
  }
  player.y=0; player.vy=0; player.onGround=true; player.inv=0; player.jumpsLeft=0;
  game.t=0; game.scroll=0; game.passed=0; game.speed=CFG.startSpeed;
  game.dying=false; game.dieT=0; game.cleared=false; game.clearT=0;
  game.hearts = Math.max(1, Math.round(CFG.lives));
  game.lagT=0; game.bufferT=0; game.falling=[];
  game.obstacles = buildObstacles(W);
  game.hills=[]; const hr = mulberry32(1234);
  for(let i=0;i<14;i++) game.hills.push({x:i*180+hr()*60, r:50+hr()*70});
  renderCollected();
  game.running=true; game.last=performance.now();
  if(!game.startTime) game.startTime = Date.now();
  cancelAnimationFrame(game.raf);
  game.raf = requestAnimationFrame(loop);
}

/* 遊戲畫面的主要輸入：死掉時是「重來」，其他時候是「跳」 */
function press(){
  if(game.dying){
    if(game.dieT >= CFG.deathDelay) startLevel();
    return;
  }
  jump();
}
function jump(){
  if(!game.running || game.dying || game.cleared) return;
  if(player.onGround){
    if(game.lagT > 0){ game.bufferT = CFG.buffer; return; }   // 剛落地，先把這次輸入記著
    player.vy = -CFG.jumpV; player.onGround = false; game.bufferT = 0;
    player.jumpsLeft = CFG.doubleJump ? 1 : 0;
    sJump();
  }else if(player.jumpsLeft > 0){
    player.vy = -CFG.jumpV*0.92; player.jumpsLeft--;
    sJump();
  }else{
    game.bufferT = CFG.buffer;
  }
}
function releaseJump(){ if(player.vy < -CFG.cutV) player.vy = -CFG.cutV; }

function hit(){
  if(CFG.invincible || player.inv > 0 || game.dying) return;
  game.hearts--;
  if(game.hearts > 0){ player.inv = 1.1; sHurt(); return; }
  game.dying = true; game.dieT = 0; game.deaths++; game.passed = 0;
  sDie();
  spillChars();          // 文字從格子裡掉出來、散掉，不讓人靠一直死來慢慢讀
  renderCollected();
}

/* 死亡時把畫面上所有文字變成掉落的碎片 */
function spillChars(){
  const cell = Math.round(CFG.cell);
  game.falling = [];
  for(const o of game.obstacles){
    if(o.x > W + 60 || o.x + o.w < -60) continue;
    for(const b of o.cells){
      const oc = b.size || o.cell || cell;
      game.falling.push({
        ch: b.ch,
        size: oc,
        x: o.x + b.dx + oc/2,
        y: groundY - b.top + oc/2,
        vx: (Math.random()-0.5)*220,
        vy: -80 - Math.random()*220,
        rot: 0,
        vr: (Math.random()-0.5)*9,
        life: 0
      });
    }
  }
}

/* 主迴圈的外殼：就算這一幀算壞了也要把下一幀排出去，畫面絕不定格 */
function loop(now){
  const before = game.raf;
  try{
    frame(now);
  }catch(e){
    if(!drawErr) drawErr = (e && e.message ? e.message : String(e));
    if(game.raf === before) game.raf = requestAnimationFrame(loop);
  }
}

function frame(now){
  // 時間差一旦變成 NaN（例如瀏覽器沒給時間戳），game.t 會永遠是 NaN，
  // 後面所有依賴它的計算都會壞掉，所以這裡先擋住。
  let dt = (now - game.last)/1000;
  if(!isFinite(dt) || dt < 0) dt = 1/60;
  dt = Math.min(0.033, dt);
  game.last = isFinite(now) ? now : (game.last + dt*1000);
  if(!isFinite(game.t)) game.t = 0;
  game.t += dt;

  if(game.dying){
    game.dieT += dt;
    if(game.dieT < CFG.deathDelay){                 // 停頓期間身體往下掉，之後定格等玩家按鍵
      player.vy += CFG.gravity*dt*0.6; player.y += player.vy*dt;
    }
    for(const p of game.falling){                   // 文字碎片繼續掉、繼續淡出
      p.vy += 1700*dt; p.x += p.vx*dt; p.y += p.vy*dt;
      p.rot += p.vr*dt; p.life += dt;
    }
    if(game.dieT >= CFG.deathDelay) showDeathRow(true);
    draw();
    game.raf = requestAnimationFrame(loop); return;
  }
  if(game.cleared){
    game.clearT += dt; game.scroll += game.speed*dt; stepPlayer(dt);
    draw();
    if(game.clearT > 1.1){ game.running=false; goQuiz(); return; }
    game.raf = requestAnimationFrame(loop); return;
  }

  game.speed = Math.min(CFG.maxSpeed, CFG.startSpeed + game.passed*CFG.speedStep);
  const dx = game.speed*dt;
  game.scroll += dx;
  stepPlayer(dt);
  if(player.inv > 0) player.inv -= dt;

  const px = player.x, py = groundY - player.h + player.y;
  const pad = CFG.forgive;
  let allGone = level.groups.length > 0;

  const cellNow = Math.round(CFG.cell);
  for(const o of game.obstacles){
    o.x -= dx;
    if(px + player.w - pad > o.x + 3 && px + pad < o.x + o.w - 3){
      for(const b of o.cells){
        const oc = b.size || o.cell || cellNow;
        const bl = o.x + b.dx, br = bl + oc;
        if(px + player.w - pad <= bl + 3 || px + pad >= br - 3) continue;
        const bt = groundY - b.top, bb = bt + oc;
        if(py + player.h - 4 > bt + 3 && py + 4 < bb - 3){
          hit();
          if(game.dying){ draw(); game.raf = requestAnimationFrame(loop); return; }
          break;
        }
      }
    }
    if(!o.passed && o.x + o.w < px){ o.passed = true; game.passed++; sPass(game.passed-1); renderCollected(); }
    if(o.x + o.w > -40) allGone = false;
  }
  if(allGone && !game.cleared){ game.cleared = true; sClear(); }

  draw();
  game.raf = requestAnimationFrame(loop);
}

function stepPlayer(dt){
  const wasAir = !player.onGround;
  player.vy += CFG.gravity*dt;
  player.y += player.vy*dt;
  if(player.y >= 0){
    player.y = 0; player.vy = 0; player.onGround = true;
    if(wasAir){ game.lagT = CFG.landLag; sLand(); }   // 剛落地：進入起跳間隔
  }else{
    player.onGround = false;
  }
  game.lagT = Math.max(0, game.lagT - dt);
  game.bufferT = Math.max(0, game.bufferT - dt);
  // 間隔一過，把記著的那次跳躍放出去
  if(player.onGround && game.lagT <= 0 && game.bufferT > 0){ game.bufferT = 0; jump(); }
}

/* ================= 繪圖（Chrome 離線恐龍風：白底、單色 #535353、硬邊像素） ================= */
const px = v => Math.round(v);                  // 一律對齊整數像素，避免糊邊

/* 繪圖若拋出例外，動畫迴圈就會斷掉、畫面定格。
   包一層保險：出錯就記下來顯示在畫面上，但遊戲繼續跑。 */
let drawErr = null;
function draw(){
  try{ drawScene(); }
  catch(e){
    if(!drawErr){ drawErr = (e && e.message ? e.message : String(e)); }
    try{
      ctx.fillStyle = "#8f3d2b";
      ctx.font = '12px ui-monospace,Menlo,Consolas,monospace';
      ctx.textAlign = "left"; ctx.textBaseline = "top";
      ctx.fillText("繪圖錯誤：" + drawErr, 12, 12);
    }catch(_){}
  }
}

function drawScene(){
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  const cell = Math.round(CFG.cell);
  ctx.lineCap = "butt"; ctx.lineJoin = "miter";

  // 遠景像素雲
  ctx.fillStyle = "#c8c8c8";
  const coff = -(game.scroll*0.22) % (14*180);
  for(const h of game.hills){
    const hx = px(h.x + coff), hy = px(groundY - 150 - (h.r % 60));
    if(hx < -90 || hx > W+90 || hy < 8) continue;
    const u = 4;                                 // 像素單位
    ctx.fillRect(hx+u*2, hy,       u*6, u);
    ctx.fillRect(hx+u,   hy+u,     u*9, u);
    ctx.fillRect(hx,     hy+u*2,   u*11, u);
    ctx.fillRect(hx+u,   hy+u*3,   u*9, u);
  }

  // 地面：一條實線 + 隨機小石子
  ctx.fillStyle = "#535353";
  ctx.fillRect(0, px(groundY), W, 2);
  const step = 34, off = -(game.scroll % step);
  for(let x=off; x<W+step; x+=step){
    const r2 = mulberry32(Math.floor((game.scroll+x)/step)*7919);
    if(r2() < 0.55) continue;
    const w = 2 + Math.floor(r2()*4), yy = px(groundY + 5 + Math.floor(r2()*7));
    ctx.fillRect(px(x + r2()*12), yy, w, 2);
  }

  // 障礙物：沒有外框，只有灰色文字
  for(const o of game.obstacles){
    if(o.x > W+60 || o.x + o.w < -60) continue;
    if(game.dying) continue;               // 死掉時字會掉出去，這裡就不畫了
    ctx.fillStyle = "#535353";
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const b of o.cells){
      const oc = b.size || o.cell || cell;
      ctx.font = "700 " + Math.round(oc*0.92) + 'px ui-monospace,Menlo,Consolas,"PingFang TC","Microsoft JhengHei",monospace';
      const cx = px(o.x + b.dx), cy = px(groundY - b.top);
      ctx.fillText(b.ch, cx+oc/2, cy+oc/2+1);
    }
  }

  // 掉落中的文字碎片
  if(game.falling.length){
    ctx.textAlign="center"; ctx.textBaseline="middle";
    for(const p of game.falling){
      ctx.font = "700 " + Math.round((p.size||cell)*0.92) + 'px ui-monospace,Menlo,Consolas,"PingFang TC","Microsoft JhengHei",monospace';
      const a = 1 - p.life/0.55;
      if(a <= 0 || p.y > H + 40) continue;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.translate(px(p.x), px(p.y)); ctx.rotate(p.rot);
      ctx.fillStyle = "#535353";
      ctx.fillText(p.ch, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  drawRunner();

  if(CFG.lives > 1){
    ctx.fillStyle = "#535353";
    ctx.font = '700 13px ui-monospace,Menlo,Consolas,monospace';
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    ctx.fillText("HP " + "■".repeat(Math.max(0,game.hearts)), 14, 14);
  }

  if(game.dying){
    ctx.fillStyle = "rgba(255,255,255,.72)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "#535353"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font = '700 22px ui-monospace,Menlo,Consolas,"PingFang TC","Microsoft JhengHei",monospace';
    ctx.fillText("G A M E   O V E R", W/2, H/2 - 18);
    if(game.dieT >= CFG.deathDelay){
      drawReloadIcon(px(W/2 - 10), px(H/2 + 8));
      ctx.fillStyle = "#a3a3a3";
      ctx.font = '12px ui-monospace,Menlo,Consolas,"PingFang TC","Microsoft JhengHei",monospace';
      ctx.fillText("按空白鍵或點一下畫面，從頭再來", W/2, H/2 + 44);
    }
  }
  if(game.cleared){
    ctx.fillStyle = "rgba(255,255,255,.72)"; ctx.fillRect(0,0,W,H);
    ctx.fillStyle = "#535353"; ctx.textAlign="center"; ctx.textBaseline="middle";
    ctx.font = '700 22px ui-monospace,Menlo,Consolas,"PingFang TC","Microsoft JhengHei",monospace';
    ctx.fillText("C L E A R", W/2, H/2);
  }
}

/* 重玩圖示：一個像素風的循環箭頭 */
function drawReloadIcon(x, y){
  ctx.fillStyle = "#535353";
  const u = 2;
  ctx.fillRect(x+u*2, y,       u*6, u);
  ctx.fillRect(x,     y+u,     u*2, u);
  ctx.fillRect(x+u*8, y+u,     u*2, u);
  ctx.fillRect(x,     y+u*2,   u,   u*3);
  ctx.fillRect(x+u*9, y+u*2,   u,   u*3);
  ctx.fillRect(x,     y+u*5,   u*2, u);
  ctx.fillRect(x+u*8, y+u*5,   u*2, u);
  ctx.fillRect(x+u*2, y+u*6,   u*6, u);
  ctx.fillRect(x+u*7, y-u,     u,   u*3);   // 箭頭
  ctx.fillRect(x+u*9, y-u,     u,   u*3);
}

/* 像素恐龍：17×21 的格點圖，'#' 深灰、'o' 眼睛、'.' 透空。
   身體 18 列固定，最後 3 列換腳做出跑步動畫。 */
const DINO_BODY = [
  "....................#########.....",
  "...................###########....",
  "..................#############...",
  "..................#############...",
  "..................#############...",
  "..................########o#######",
  "..................########o#######",
  "..................################",
  "..................################",
  "..................################",
  "..................################",
  ".................#################",
  "................#############.....",
  "...............##############.....",
  "..............###############.....",
  "#.............###############.....",
  "##............########............",
  "####..........########............",
  "#####.........########............",
  "#######......#########............",
  ".#####################............",
  "..#####################...........",
  "...####################...........",
  "....####################..........",
  ".....###################..........",
  "........#################.........",
  ".......####################.......",
  ".......####################.......",
  ".......###################........",
  "........################.#........",
  ".........##############...........",
  ".........##############...........",
  ".........#####...#####............"
];
/* 會動的是最下面幾列：抬腿、伸腿、腳掌位置都會換 */
const DINO_LEGS = [
  [
    ".........#####...########.........",
    ".........#####...########.........",
    ".........#####...########.........",
    ".........#####...########.........",
    ".........#####....................",
    ".......#########..................",
    ".......#########..................",
    ".......#########..................",
    ".......#########.................."
  ],   // 後腳著地
  [
    "......########...#####............",
    "......########...#####............",
    "......########...#####............",
    "......########...#####............",
    ".................#####............",
    "...............#########..........",
    "...............#########..........",
    "...............#########..........",
    "...............#########.........."
  ],   // 前腳著地
  [
    ".........#####...#####............",
    ".........#####...#####............",
    ".........#####...#####............",
    ".........#####...#####............",
    ".......#################..........",
    ".......#################..........",
    ".......#################..........",
    ".......#################..........",
    ".................................."
  ],   // 騰空：雙腳併攏
];
const DINO_ROWS = DINO_BODY.length + DINO_LEGS[0].length, DINO_COLS = DINO_BODY[0].length;

function drawRunner(){
  if(player.inv > 0 && Math.floor(game.t*14)%2===0) return;
  if(runnerReady){                       // 換成自訂的角色圖
    try{
      const im = runnerFrame();
      const iw = im.naturalWidth || im.width || 1;
      const ih = im.naturalHeight || im.height || 1;
      const k = Math.min(player.w/iw, player.h/ih) * Math.max(0.2, CFG.runnerScale);
      const dw = Math.max(1, iw*k), dh = Math.max(1, ih*k);
      ctx.drawImage(im, px(player.x + (player.w-dw)/2),
                        px(groundY + player.y - dh), dw, dh);   // 以腳底對齊地面
      return;
    }catch(e){ runnerReady = false; }
  }
  const u = Math.max(1, Math.round(player.h / DINO_ROWS));     // 42 列 → 1 單位一格
  const x0 = px(player.x), y0 = px(groundY + player.y) - DINO_ROWS*u;
  // 跑越快、腳換越快（任何一個數值出問題都退回站姿，絕不讓恐龍缺腿）
  const spd = isFinite(game.speed) ? game.speed : 300;
  const t = isFinite(game.t) ? game.t : 0;
  let legs = DINO_LEGS[2];
  if(player.onGround){
    const i = Math.floor(t * (8 + spd/60)) % 2;
    legs = DINO_LEGS[isFinite(i) ? Math.abs(i) : 0] || DINO_LEGS[0];
  }
  const art = DINO_BODY.concat(legs);
  for(let r=0;r<art.length;r++){
    const line = art[r];
    if(!line) continue;
    let c = 0;
    while(c < line.length){                    // 同色的相鄰格子併成一次繪製
      const ch = line[c];
      if(ch === "."){ c++; continue; }
      let n = 1;
      while(c+n < line.length && line[c+n] === ch) n++;
      ctx.fillStyle = (ch === "o") ? "#ffffff" : "#535353";
      ctx.fillRect(x0 + c*u, y0 + r*u, n*u, u);
      c += n;
    }
  }
}

/* 標題頁的小圖示：跟遊戲裡同一份格點圖，站姿 + 一小段地面 */
function drawTitleDino(){
  const cv2 = $("title-dino");
  if(!cv2 || !cv2.getContext) return;
  const art = DINO_BODY.concat(DINO_LEGS[2]);
  const cols = DINO_COLS, rows = art.length;
  const u = 2, padL = 4, padT = 2, groundGap = 6;
  const w = Math.max(cols*u + padL*2 + 16, 88), h = rows*u + padT + groundGap + 10;
  const dpr = Math.min(window.devicePixelRatio||1, 2);
  cv2.width = Math.round(w*dpr); cv2.height = Math.round(h*dpr);
  cv2.style.width = w+"px"; cv2.style.height = h+"px";
  const c = cv2.getContext("2d");
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,w,h);
  for(let r=0;r<rows;r++){
    const line = art[r];
    if(!line) continue;
    let k = 0;
    while(k < line.length){
      const ch = line[k];
      if(ch === "."){ k++; continue; }
      let n = 1;
      while(k+n < line.length && line[k+n] === ch) n++;
      c.fillStyle = (ch === "o") ? "#ffffff" : "#535353";
      c.fillRect(padL + k*u, padT + r*u, n*u, u);
      k += n;
    }
  }
  // 腳下的一小段地面，跟離線頁的圖示一樣
  const gy = padT + rows*u + groundGap;
  c.fillStyle = "#535353";
  c.fillRect(0, gy, w-10, 2);
  c.fillStyle = "#a3a3a3";
  c.fillRect(8, gy+5, 4, 2); c.fillRect(26, gy+5, 3, 2); c.fillRect(48, gy+5, 5, 2);
}

/* ================= 自訂的主角圖 ================= */
let RUNNER = [], runnerReady = false;
function loadRunner(){
  runnerReady = false;
  RUNNER = [];
  const list = Array.isArray(CFG.runnerImgs) ? CFG.runnerImgs : [];
  if(!list.length) return;
  let loaded = 0;
  list.forEach((src, i)=>{
    const im = new Image();
    im.onload = ()=>{ loaded++; if(loaded === list.length) runnerReady = true; };
    im.onerror = ()=>{ RUNNER = []; runnerReady = false; };
    im.src = src;
    RUNNER[i] = im;
  });
}
/* 這一幀該用第幾張圖：
   1 張＝靜止；2 張＝跑步時交替；3 張以上＝最後一張當騰空姿勢，其餘輪流跑 */
function runnerFrame(){
  const n = RUNNER.length;
  if(n <= 1) return RUNNER[0];
  if(!player.onGround) return n >= 3 ? RUNNER[n-1] : RUNNER[0];
  const cycle = n >= 3 ? n-1 : n;
  const spd = isFinite(game.speed) ? game.speed : 300;
  const t = isFinite(game.t) ? game.t : 0;
  const i = Math.floor(t * (8 + spd/60)) % cycle;
  return RUNNER[Math.abs(i)] || RUNNER[0];
}
/* 存進設定前先縮到 128px 以內，否則塞不進瀏覽器的儲存空間、匯出的檔案也會過肥 */
function shrinkImage(file, cb){
  const fr = new FileReader();
  fr.onload = ()=>{
    const im = new Image();
    im.onload = ()=>{
      const M = 128;
      const k = Math.min(1, M/Math.max(im.width||1, im.height||1));
      const w = Math.max(1, Math.round((im.width||1)*k)), h = Math.max(1, Math.round((im.height||1)*k));
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(im, 0, 0, w, h);
      try{ cb(c.toDataURL("image/png")); }catch(e){ cb(fr.result); }
    };
    im.onerror = ()=>cb(null);
    im.src = fr.result;
  };
  fr.onerror = ()=>cb(null);
  fr.readAsDataURL(file);
}

/* ================= 已收集文字 ================= */
function collectedChars(){
  let n=0;
  for(let i=0;i<game.passed && i<level.groups.length;i++) n += level.groups[i].length;
  return level.chars.slice(0,n);
}
function renderCollected(){
  const hud = $("hud"), col = $("collected"), meta = $("meta");
  showDeathRow(false);
  col.style.display = CFG.hudCollected ? "" : "none";
  meta.style.display = CFG.hudProgress ? "" : "none";
  hud.style.display = (CFG.hudCollected || CFG.hudProgress) ? "" : "none";
  if(CFG.hudCollected){
    const got = collectedChars(), rest = level.chars.length - got.length;
    col.innerHTML = got.join("") + '<span class="blank">' + "＿".repeat(Math.min(rest,40)) + '</span>';
  }
  if(CFG.hudProgress) meta.textContent = `已閃過 ${game.passed}/${level.groups.length} 組 · 失敗 ${game.deaths} 次`;
}

/* ================= 問答 ================= */
let tries = 0;
function normalize(s){
  return String(s).trim().toLowerCase().replace(/\s+/g,"")
    .replace(/[。，、．,.!！?？；;:：「」『』"'()（）\-—_~～]/g,"");
}
function goQuiz(){
  tries = 0;
  $("quiz-lead").textContent = CFG.quizLead || "";
  $("quiz-question").textContent = level.text;
  $("quiz-question").style.display = CFG.quizShowQuestion ? "" : "none";
  $("in-guess").value=""; $("verdict").textContent=""; $("verdict").className="verdict";
  show("quiz");
  setTimeout(()=>$("in-guess").focus(),120);
}
function submitAnswer(){
  const g = $("in-guess").value;
  if(!normalize(g)){ $("verdict").className="verdict bad"; $("verdict").textContent="先寫點什麼吧。"; return; }
  const ok = level.answers.length===0 || level.answers.some(a=>normalize(a)===normalize(g));
  if(ok){ sRight(); finish(g.trim()); return; }
  sWrong();
  tries++;
  let msg = "不對喔，再想想。（第 "+tries+" 次）";
  if(level.hint && tries >= CFG.hintAfter) msg += "　提示：" + level.hint;
  if(CFG.revealAfter > 0 && tries >= CFG.revealAfter){
    $("quiz-question").style.display = "";
    msg += "　題目是：" + level.text;
  }
  $("verdict").className="verdict bad"; $("verdict").textContent=msg;
}
function finish(ans){
  $("res-question").textContent = CFG.resultShowQuestion ? level.text : "";
  $("res-question").style.display = CFG.resultShowQuestion ? "" : "none";
  $("res-question").previousElementSibling.style.display = CFG.resultShowQuestion ? "" : "none";
  $("res-answer").textContent = level.answers.length ? level.answers[0] : ans;
  const note = String(CFG.finalNote||"").trim();
  $("res-note").textContent = note;
  $("res-note").style.display = note ? "block" : "none";
  const secs = Math.round((Date.now()-game.startTime)/1000);
  $("res-stats").textContent =
    `共 ${level.groups.length} 組障礙、${level.chars.length} 個字 · 失敗 ${game.deaths} 次 · 花了 ${Math.floor(secs/60)} 分 ${secs%60} 秒`;
  show("result");
}

/* ================= 遊戲控制 ================= */
function beginGame(){
  prepareLevel();
  if(level.chars.length < 1){ alert("關卡文字是空的。"); return; }
  game.deaths=0; game.startTime=0;
  show("game"); startLevel();
}
/* 綁定按鈕：元素不存在就跳過，不會讓後面的程式整段停掉 */
function on(id, fn){ const el = $(id); if(el) el.onclick = fn; }
on("btn-start", beginGame);
$("scr-title").addEventListener("click", ()=>{ if($("scr-title").classList.contains("on")) beginGame(); });
on("btn-again", beginGame);
on("btn-replay", ()=>{ show("game"); startLevel(); });
on("btn-answer", ()=>{
  game.running = false; cancelAnimationFrame(game.raf);
  goQuiz();
});
on("btn-submit", submitAnswer);
$("in-guess").addEventListener("keydown", e=>{ if(e.key==="Enter") submitAnswer(); });

/* 一次按壓只算一次輸入：按著不放不會連跳，要再跳必須放開重按 */
let keyHeld = false, pointerHeld = false;
const isJumpKey = e => (e.code==="Space" || e.code==="ArrowUp" || e.key===" ");
document.addEventListener("keydown", e=>{
  if(!isJumpKey(e)) return;
  if($("scr-title").classList.contains("on")){   // 標題頁：空白鍵直接開始
    e.preventDefault(); beginGame(); return;
  }
  if(!$("scr-game").classList.contains("on")) return;
  e.preventDefault();
  if(e.repeat || keyHeld) return;          // 系統的按鍵重複、或還按著沒放，一律忽略
  keyHeld = true;
  press();
});
document.addEventListener("keyup", e=>{
  if(!isJumpKey(e)) return;
  keyHeld = false;
  releaseJump();
});
window.addEventListener("blur", ()=>{ keyHeld = false; pointerHeld = false; });
cv.addEventListener("mousedown", e=>{ e.preventDefault(); if(pointerHeld) return; pointerHeld = true; press(); });
window.addEventListener("mouseup", ()=>{ pointerHeld = false; releaseJump(); });
cv.addEventListener("touchstart", e=>{ e.preventDefault(); if(pointerHeld) return; pointerHeld = true; press(); },{passive:false});
cv.addEventListener("touchend", e=>{ e.preventDefault(); pointerHeld = false; releaseJump(); },{passive:false});
cv.addEventListener("touchcancel", ()=>{ pointerHeld = false; releaseJump(); });

/* 版本標記：一打開就知道拿到的是不是最新的檔案（快取沒清的話會停在舊日期） */

/* ================= 面板（玩家版沒有這一段的 UI） ================= */
const panel = $("panel");
if(panel && !BAKED){
  const inputs = {}, marks = {};
  let initErr = null;

  SPEC.forEach(s=>{
    const box = document.createElement("div");
    box.className = "ctrl";
    if(s.type==="check"){
      box.className = "chk";
      const cb = document.createElement("input");
      cb.type="checkbox"; cb.id="c-"+s.k;
      const lb = document.createElement("label");
      lb.htmlFor = cb.id; lb.textContent = s.label; lb.style.margin="0";
      box.appendChild(cb); box.appendChild(lb);
      cb.checked = !!CFG[s.k];                    // 建立當下就填好，不等後面的初始化
      cb.addEventListener("change", ()=>{ CFG[s.k] = cb.checked; onChange(s); });
      inputs[s.k] = cb; marks[s.k] = lb;
    }else{
      const top = document.createElement("div"); top.className="top";
      const nm = document.createElement("span"); nm.textContent = s.label;
      const vl = document.createElement("span"); vl.className="val"; vl.id="v-"+s.k;
      top.appendChild(nm); top.appendChild(vl);
      const r = document.createElement("input");
      r.type="range"; r.min=s.min; r.max=s.max; r.step=s.step; r.id="c-"+s.k;
      box.appendChild(top); box.appendChild(r);
      if(s.note){ const n=document.createElement("div"); n.className="note"; n.textContent=s.note; box.appendChild(n); }
      r.addEventListener("input", ()=>{
        CFG[s.k] = parseFloat(r.value);
        setVal(s);
        onChange(s);
      });
      inputs[s.k] = r; marks[s.k] = vl;
      r.value = CFG[s.k];                         // 同上：位置與數值一起就位
      vl.textContent = fmt(s, CFG[s.k]);
    }
    $("g-"+s.g).appendChild(box);
  });

  /* 任何情況都要能顯示出東西，不能因為某一個值壞掉就讓整排數字消失 */
  function fmt(s,v){
    const n = parseFloat(v);
    if(!isFinite(n)) return String(DEFAULTS[s.k]) + (s.unit||"");
    return (s.step < 1 ? n.toFixed(2) : n) + (s.unit||"");
  }
  function setVal(s){
    const m = marks[s.k];
    if(m && s.type !== "check") m.textContent = fmt(s, CFG[s.k]);
  }

  document.querySelectorAll("[data-cfg]").forEach(el=>{
    const k = el.getAttribute("data-cfg");
    el.value = CFG[k] || "";                   // 一樣，當下就填好
    el.addEventListener("input", ()=>{
      CFG[k] = el.value;
      applyTexts(); save();
      if(k==="question" || k==="answers" || k==="hint"){
        prepareLevel();                      // 答案／提示改了要立刻生效，不必重開一輪
        if(k==="question"){
          if($("scr-game").classList.contains("on")) startLevel();
          refresh(false);
        }
      }
    });
  });

  SAMPLES.forEach(s=>{
    const b=document.createElement("button");
    b.className="chip"; b.type="button"; b.textContent=s;
    b.onclick=()=>{ CFG.question=s; document.querySelector('[data-cfg="question"]').value=s;
      prepareLevel(); if($("scr-game").classList.contains("on")) startLevel(); refresh(); };
    $("samples").appendChild(b);
  });

  let rebuildTimer = 0;
  function onChange(s){
    if(s.k === "titleImgH"){ try{ updateTitleArt(); }catch(e){} }   // 首頁圖片大小要即時反映
    if(s.rebuild) prepareLevel();
    save(); refresh(false);
    if(s.rebuild && $("scr-game").classList.contains("on")){
      clearTimeout(rebuildTimer);
      rebuildTimer = setTimeout(()=>{ prepareLevel(); startLevel(); }, 220);
    }
  }

  function refresh(syncInputs){
    if(syncInputs !== false){
      SPEC.forEach(s=>{
        try{
          const el = inputs[s.k];
          if(!el) return;
          setVal(s);
          if(s.type==="check") el.checked = !!CFG[s.k];
          else el.value = CFG[s.k];
        }catch(e){}          // 單一控制項出問題，不能連累其他人
      });
      document.querySelectorAll("[data-cfg]").forEach(el=>{ el.value = CFG[el.getAttribute("data-cfg")] || ""; });
    }
    // 即時數據
    const VIEW = computeView();
    const h = jumpHeight(), t = airTime(), cell = Math.round(CFG.cell);
    const canStack = Math.floor((h - 6) / cell);
    const topSpeed = Math.min(CFG.maxSpeed, CFG.startSpeed + Math.max(0, level.groups.length-1)*CFG.speedStep);
    const jumpDist = topSpeed * t;
    $("readout").innerHTML =
      `跳躍高度 <b>${h.toFixed(0)} px</b>（最高可越過 <b>${canStack}</b> 層文字）<br>`+
      `滯空時間 <b>${t.toFixed(2)} 秒</b>・最高速時一次跳 <b>${jumpDist.toFixed(0)} px</b><br>`+
      `關卡 <b>${level.groups.length}</b> 組 / <b>${level.chars.length}</b> 字・最高速 <b>${topSpeed.toFixed(0)} px/秒</b><br>`+
      `障礙物從進畫面到抵達 <b>${((CFG.viewW - player.x)/Math.max(1,CFG.startSpeed)).toFixed(2)}</b> 秒`+
      `（最高速時 <b>${((CFG.viewW - player.x)/Math.max(1,topSpeed)).toFixed(2)}</b> 秒）<br>`+
`<span style="opacity:.6">檔案版本 ${BUILD}</span><br>`+
      `目前畫面 <b>${VIEW.w} × ${VIEW.h}</b> 單位（<b>${(VIEW.w/Math.max(1,VIEW.h)).toFixed(2)} : 1</b>，`+
      `上下置中）・放大 <b>${VIEW.scale.toFixed(2)}×</b>`;
    // 這一關實際的高度分佈
    const obs = buildObstacles(Math.round(CFG.viewW));
    const slots = Math.max(1, Math.round(CFG.maxStack));
    let topHit = 0, lifted = 0, sumTop = 0;
    obs.forEach(o=>{
      if(o.topOff >= slots*(o.cell||cell)) topHit++;
      if(o.float > 0) lifted++;
      sumTop += o.topOff;
    });
    const nOb = obs.length || 1;
    let gMin=Infinity, gMax=0, jMin=Infinity, jMax=0, fullSafe=0, jumpable=0, lying=0;
    obs.forEach((o,k)=>{
      if(o.lie) lying++;
      if(!o.duckable && o.gapAfter != null && k < obs.length-1){
        jumpable++;
        if((o.w + 34 + o.gapAfter)/o.speedAfter >= t) fullSafe++;   // 跳滿也還來得及落地
      }
      if(k === obs.length-1 || !o.gapAfter) return;
      gMin=Math.min(gMin,o.gapAfter); gMax=Math.max(gMax,o.gapAfter);
      const ju = o.gapAfter/(o.speedAfter*t);
      jMin=Math.min(jMin,ju); jMax=Math.max(jMax,ju);
    });
    const sizeCount = {};
    obs.forEach(o=>{ sizeCount[o.n] = (sizeCount[o.n]||0)+1; });
    const sizeTxt = Object.keys(sizeCount).sort()
      .map(k=>`${k} 字 <b>${(sizeCount[k]/nOb*100).toFixed(0)}%</b>`).join("・");
    $("readout").innerHTML +=
      `<br>字數分佈 ${sizeTxt}`+
      `<br>頂到最高格 <b>${topHit}</b>/${nOb} 組（<b>${(topHit/nOb*100).toFixed(0)}%</b>）`+
      `・離地 <b>${(lifted/nOb*100).toFixed(0)}%</b>・橫躺 <b>${(lying/nOb*100).toFixed(0)}%</b>`+
      `・平均高度 <b>${(sumTop/nOb).toFixed(0)} px</b>`+
      (gMax ? `<br>實際間距 <b>${gMin.toFixed(0)}–${gMax.toFixed(0)} px</b>`+
              `（<b>${jMin.toFixed(2)}–${jMax.toFixed(2)}</b> 次跳躍）` : "")+
      (jumpable ? `<br>「一律跳滿」還能安全的組別 <b>${(fullSafe/jumpable*100).toFixed(0)}%</b>`+
                  (fullSafe/jumpable > 0.9 ? `（跳滿幾乎沒有代價）` : fullSafe/jumpable < 0.4 ? `（必須控制跳躍高度）` : ``) : "");

    // 自動試跑：固定種子就跑這一關；全隨機就抽驗 20 種可能
    let test = {ok:true}, tried = 1;
    if(CFG.randomSeed){
      tried = 20;
      for(let n=0;n<tried;n++){
        const r = autoTest(1 + Math.floor(Math.random()*99999));
        if(!r.ok){ test = r; break; }
      }
    }else{
      test = autoTest();
    }
    const warns = [];
    if(test.ok){
      const ts = timingStats(obs);
      const ms = ts.ms;
      const col = ms==null ? "#535353" : (ms < 100 ? "#8f3d2b" : (ms < 180 ? "#8a6d1f" : "#4a7a4a"));
      $("readout").innerHTML += `<br><span style="color:#4a7a4a">自動試跑：<b>可以通關 ✓</b>`+
        (CFG.randomSeed ? `（連抽 ${tried} 種排列都過）` : ``)+`</span>`+
        (ms==null ? `` : `<br>最緊的起跳窗口 <b style="color:${col}">${ms} 毫秒</b>（第 ${ts.at} 組）`+
          (ms < 100 ? `　很硬` : ms < 180 ? `　有難度` : `　寬鬆`));
    }else{
      warns.push("自動試跑失敗 — " + test.why + "。");
    }
    // 跳到最高時恐龍會不會衝出畫面上緣
    // 視窗太矮的話畫面會改成左右留白，提醒一下
    if(VIEW.tight){
      warns.push(`視窗高度不夠，橫帶已縮小以塞進畫面，左右因此留白。`+
                 `把「橫帶高度」調低（目前 ${VIEW.h}、最低可到 ${VIEW.minH}）或把視窗拉高就能恢復滿版。`);
    }
    if(CFG.invincible) warns.push("目前是無敵模式，記得關掉再匯出。");
    if(initErr) warns.push(initErr);
    $("warn").className = warns.length ? "on" : "";
    $("warn").innerHTML = warns.join("<br>");
  }

  /* ---- 匯出 ---- */
  function exportHTML(){
    const clone = document.documentElement.cloneNode(true);
    const p = clone.querySelector("#panel"); if(p) p.remove();
    const st = clone.querySelector("#stage"); if(st) st.innerHTML = PRISTINE_STAGE;
    clone.querySelector("body").classList.add("baked");
    const t = clone.querySelector("title"); if(t) t.textContent = CFG.title || "文字闖關";
    const cfgScript = clone.ownerDocument.createElement("script");
    cfgScript.textContent = "window.__BAKED__=" + JSON.stringify(CFG) + ";";
    const main = clone.querySelector("body > script");
    main.parentNode.insertBefore(cfgScript, main);
    const html = "<!DOCTYPE html>\n" + clone.outerHTML;
    const blob = new Blob([html], {type:"text/html;charset=utf-8"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (CFG.title || "文字闖關") + ".html";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }
  /* 按鈕綁定包在 try 裡：任何一顆對不上都不該讓後面的初始化整段不跑 */
  try{
  $("btn-export").onclick = exportHTML;

  $("btn-copy-cfg").onclick = function(){
    const s = JSON.stringify(CFG, null, 2);
    const done=()=>{ const o=this.textContent; this.textContent="已複製 ✓"; setTimeout(()=>this.textContent=o,1400); };
    if(navigator.clipboard && location.protocol!=="file:") navigator.clipboard.writeText(s).then(done, ()=>prompt("設定 JSON：", s));
    else{
      const ta=document.createElement("textarea"); ta.value=s; document.body.appendChild(ta); ta.select();
      try{ document.execCommand("copy"); done(); }catch(e){ prompt("設定 JSON：", s); }
      ta.remove();
    }
  };
  $("btn-paste-cfg").onclick = ()=>{
    const s = prompt("貼上設定 JSON：");
    if(!s) return;
    try{ CFG = sanitize(Object.assign({}, DEFAULTS, JSON.parse(s))); }
    catch(e){ alert("看起來不是有效的 JSON。"); return; }
    prepareLevel(); applyTexts(); loadRunner(); refresh(); save();
    if($("scr-game").classList.contains("on")) startLevel();
  };
  /* 首頁圖片 */
  function refreshTitlePreview(){
    const img = $("title-preview");
    if(!img) return;
    if(CFG.titleImg){ img.src = CFG.titleImg; img.style.display = ""; }
    else { img.removeAttribute("src"); img.style.display = "none"; }
  }
  $("title-file").addEventListener("change", function(){
    const f = this.files && this.files[0];
    this.value = "";
    if(!f) return;
    shrinkImage(f, (data)=>{
      if(!data){ alert("這張圖讀不起來，換一張試試。"); return; }
      CFG.titleImg = data; refreshTitlePreview(); updateTitleArt(); save();
    });
  });
  $("btn-title-clear").onclick = ()=>{
    CFG.titleImg = ""; refreshTitlePreview(); updateTitleArt(); save();
  };
  refreshTitlePreview();

  /* 主角圖 */
  function refreshRunnerPreview(){
    const box = $("runner-preview");
    if(!box) return;
    box.innerHTML = "";
    (CFG.runnerImgs||[]).forEach((src,i)=>{
      const wrap = document.createElement("div");
      wrap.style.cssText = "text-align:center;font-size:10px;color:var(--ink-soft)";
      const img = document.createElement("img");
      img.src = src;
      img.style.cssText = "width:46px;height:46px;object-fit:contain;border:2px solid var(--line);background:#fff;display:block";
      const cap = document.createElement("div");
      const n = CFG.runnerImgs.length;
      cap.textContent = (n>=3 && i===n-1) ? "跳躍" : ("跑 "+(i+1));
      wrap.appendChild(img); wrap.appendChild(cap);
      box.appendChild(wrap);
    });
  }
  $("runner-file").addEventListener("change", function(){
    const files = Array.prototype.slice.call(this.files||[], 0, 4);
    this.value = "";
    if(!files.length) return;
    const out = new Array(files.length);
    let done = 0, bad = false;
    files.forEach((f,i)=>{
      shrinkImage(f, (data)=>{
        if(!data) bad = true; else out[i] = data;
        if(++done === files.length){
          const list = out.filter(Boolean);
          if(!list.length){ alert("這些圖都讀不起來，換別的試試。"); return; }
          if(bad) alert("有幾張讀不起來，已略過。");
          CFG.runnerImgs = list;
          loadRunner(); refreshRunnerPreview(); updateTitleArt(); save();
        }
      });
    });
  });
  $("btn-runner-clear").onclick = ()=>{
    CFG.runnerImgs = []; loadRunner(); refreshRunnerPreview(); updateTitleArt(); save();
  };
  refreshRunnerPreview();

  $("btn-test-sfx").onclick = ()=>{
    sJump();
    [0,1,2,3].forEach(i=> setTimeout(()=>sPass(i), 260 + i*150));
    setTimeout(sHurt, 950);
    setTimeout(sDie, 1250);
    setTimeout(sClear, 1900);
    setTimeout(sRight, 2600);
  };
  $("btn-reroll").onclick = ()=>{
    CFG.seed = 1 + Math.floor(Math.random()*999);
    prepareLevel(); refresh(); save();
    if($("scr-game").classList.contains("on")) startLevel();
  };
  $("btn-reset").onclick = ()=>{
    if(!confirm("所有參數回到預設值？")) return;
    CFG = sanitize(Object.assign({}, DEFAULTS));
    prepareLevel(); applyTexts(); loadRunner(); refresh(); save();
    if($("scr-game").classList.contains("on")) startLevel();
  };
  }catch(e){ initError(e); }

  function initError(e){
    initErr = "面板初始化時發生錯誤：" + (e && e.message ? e.message : e);
    try{ $("warn").className = "on"; $("warn").textContent = initErr; }catch(_){}
  }

  onLevelRebuilt = ()=>refresh(false);
  try{
    prepareLevel(); applyTexts(); loadRunner(); refresh();
  }catch(e){ initError(e); }
}else{
  /* 玩家版：只有遊戲 */
  prepareLevel(); applyTexts(); loadRunner();
}

resize();

/* 全部就緒才把畫面顯示出來 */
let revealed = false;
function revealPage(){
  if(revealed) return;
  revealed = true;
  try{ document.documentElement.classList.remove("js-loading"); }catch(e){}
}
function revealWhenReady(){
  const img = $("title-img");
  if(img && img.style.display === "block" && !img.complete){
    img.addEventListener("load", revealPage, {once:true});
    img.addEventListener("error", revealPage, {once:true});
    setTimeout(revealPage, 800);          // 圖片卡住也不要一直等
    return;
  }
  revealPage();
}
requestAnimationFrame(()=>requestAnimationFrame(revealWhenReady));
})();
</script>


</body></html>
